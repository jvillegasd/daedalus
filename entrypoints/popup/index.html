<!doctype html>
<html>
  <body>
    <header>
      <img src="/icons/icon-32.png" alt="" width="20" height="20" />
      <h1>Daedalus</h1>
      <button id="open" class="btn" type="button">Manager</button>
    </header>
    <main>
      <label class="field"><span>Group name</span><input id="name" placeholder="Read later" /></label>
      <div class="field">
        <span>Tags</span>
        <div id="tags" class="tags"><input id="tagInput" class="tag-add" placeholder="+ tag" aria-label="Add tag" /></div>
      </div>
      <div class="row">
        <button id="save" class="btn btn-primary" type="button">Save tabs</button>
        <button id="saveClose" class="btn" type="button">Save &amp; close</button>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
